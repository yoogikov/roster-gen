<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Leave</title>
	<style>body { font-family: sans-serif; margin: 1.5rem; } nav a { margin-right: 1rem; } .notice { background: #fff6d8; padding: 0.5rem; } label { display: block; margin-top: 0.5rem; }</style>
</head>
<body>
<nav th:replace="~{nav :: nav}"></nav>
<h1>Request leave</h1>
<p class="notice" th:if="${notice}" th:text="${notice}"></p>
<p>An admin approves it from the inbox. Approved leave blocks rostering that doctor on those days.</p>
<form method="post" action="/leave">
	<label>Doctor id <input name="staffId" th:value="${staffId}" required="required"/></label>
	<label>First day <input name="firstDay" type="date" required="required"/></label>
	<label>Last day <input name="lastDay" type="date" required="required"/></label>
	<button type="submit">Request</button>
</form>
</body>
</html>
