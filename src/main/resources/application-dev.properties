# Development and tests: in-memory H2, wiped on every restart. Synthetic data only.
spring.datasource.url=jdbc:h2:mem:roster;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true

# Shared password for the synthetic dev users; blank means generate one at startup.
roster.dev-users.password=${ROSTER_DEV_PASSWORD:}
