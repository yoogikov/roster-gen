# Production: Postgres. Credentials come ONLY from environment variables;
# startup fails if any of them is missing.
spring.datasource.url=${ROSTER_DB_URL}
spring.datasource.username=${ROSTER_DB_USER}
spring.datasource.password=${ROSTER_DB_PASSWORD}

# Never let Hibernate change the production schema.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false
