<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Doctors</title>
	<style>
		body { font-family: sans-serif; margin: 1.5rem; }
		nav a { margin-right: 1rem; }
		table { border-collapse: collapse; margin-top: 1rem; }
		td, th { border: 1px solid #ccc; padding: 0.3rem 0.5rem; vertical-align: top; }
		.notice { background: #fff6d8; padding: 0.5rem; }
		form.inline { display: inline; }
		form.stack label { display: block; margin-top: 0.5rem; }
		.inactive { color: #666; }
	</style>
</head>
<body>
<nav th:replace="~{nav :: nav}"></nav>
<h1>Doctors</h1>
<p class="notice" th:if="${notice}" th:text="${notice}"></p>

<section>
	<h2>Add a doctor</h2>
	<form class="stack" method="post" action="/doctors">
		<label>Id <input name="id" required="required" placeholder="D03"/></label>
		<label>Name <input name="name" required="required" placeholder="Test Doctor 3"/></label>
		<button type="submit">Add</button>
	</form>
</section>

<table>
	<thead>
		<tr><th>Id</th><th>Name</th><th>Active</th><th>Login</th><th>Actions</th></tr>
	</thead>
	<tbody>
		<tr th:each="doctor : ${doctors}" th:classappend="${!doctor.active()} ? 'inactive'">
			<td th:text="${doctor.id()}">D01</td>
			<td>
				<form class="inline" method="post" th:action="@{/doctors/{id}/rename(id=${doctor.id()})}">
					<input name="name" th:value="${doctor.name()}" required="required"/>
					<button type="submit">Rename</button>
				</form>
			</td>
			<td th:text="${doctor.active()} ? 'yes' : 'no'">yes</td>
			<td>
				<span th:if="${logins.containsKey(doctor.id())}"
					th:text="${logins.get(doctor.id()).username()
						+ (logins.get(doctor.id()).enabled() ? '' : ' (disabled)')}">staff1</span>
				<span th:unless="${logins.containsKey(doctor.id())}">—</span>
			</td>
			<td>
				<form class="inline" method="post" th:action="@{/doctors/{id}/active(id=${doctor.id()})}">
					<input type="hidden" name="active" th:value="${!doctor.active()}"/>
					<button type="submit" th:text="${doctor.active()} ? 'Deactivate' : 'Activate'">Deactivate</button>
				</form>
				<form class="inline" method="post" th:if="${!logins.containsKey(doctor.id()) && doctor.active()}"
					th:action="@{/doctors/{id}/login(id=${doctor.id()})}">
					<input name="username" th:placeholder="${doctor.id()}" required="required"/>
					<button type="submit">Create login</button>
				</form>
				<form class="inline" method="post" th:if="${logins.containsKey(doctor.id())}"
					th:action="@{/doctors/logins/{username}/reset(username=${logins.get(doctor.id()).username()})}">
					<button type="submit">Reset password</button>
				</form>
				<form class="inline" method="post" th:if="${logins.containsKey(doctor.id())}"
					th:action="@{/doctors/logins/{username}/enabled(username=${logins.get(doctor.id()).username()})}">
					<input type="hidden" name="enabled" th:value="${!logins.get(doctor.id()).enabled()}"/>
					<button type="submit"
						th:text="${logins.get(doctor.id()).enabled()} ? 'Disable' : 'Enable'">Disable</button>
				</form>
			</td>
		</tr>
	</tbody>
</table>
</body>
</html>
