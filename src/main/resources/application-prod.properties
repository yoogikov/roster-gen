# Production: Postgres. Credentials come ONLY from environment variables;
# startup fails if any of them is missing.
spring.datasource.url=${ROSTER_DB_URL}
spring.datasource.username=${ROSTER_DB_USER}
spring.datasource.password=${ROSTER_DB_PASSWORD}

# Flyway creates the tables once; Hibernate only checks they match the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Creates the first admin login if the user_account table is empty.
roster.admin-password=${ROSTER_ADMIN_PASSWORD}

spring.h2.console.enabled=false
