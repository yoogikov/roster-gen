plugins {
	id 'java'
	id 'pmd'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.spotbugs' version '6.5.12'
}

group = 'com.iitm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Same version the Spring Boot BOM resolves; pinned so it is visible here.
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'net.jqwik:jqwik:1.10.1'
	// @SuppressFBWarnings for justified SpotBugs false positives; same version as the SpotBugs tool.
	compileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.4'
	testCompileOnly 'com.github.spotbugs:spotbugs-annotations:4.10.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Static analysis is report-only for now: findings show up in build/reports
// but do not fail the build. Handle each finding explicitly; never suppress silently.
pmd {
	toolVersion = '7.28.0'
	ruleSets = ['rulesets/java/quickstart.xml']
	consoleOutput = true
	ignoreFailures = true
}

spotbugs {
	toolVersion = '4.10.4'
	ignoreFailures = true
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html {
			required = true
		}
	}
}

// A doctor list in, a month's roster out, without starting the app:
// ./gradlew generate --args="doctors.csv 2026-10 --holidays 2026-10-02,2026-10-20 --out roster.csv"
tasks.register('generate', JavaExec) {
	group = 'application'
	description = 'Generates a month\'s roster from a doctor list CSV.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.iitm.roster.cli.GenerateRoster'
	workingDir = rootProject.projectDir
}
