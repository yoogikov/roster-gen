<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Change password</title>
	<style>
		body { font-family: sans-serif; margin: 1.5rem; }
		nav a { margin-right: 1rem; }
		.notice { background: #fff6d8; padding: 0.5rem; }
		form.stack label { display: block; margin-top: 0.5rem; }
	</style>
</head>
<body>
<nav th:replace="~{nav :: nav}"></nav>
<h1>Change password</h1>
<p>Signed in as <span th:text="${username}">admin</span>.</p>
<p class="notice" th:if="${notice}" th:text="${notice}"></p>
<form class="stack" method="post" action="/password">
	<label>Old password <input type="password" name="oldPassword" required="required"/></label>
	<label>New password <input type="password" name="newPassword" required="required"/></label>
	<button type="submit">Change</button>
</form>
</body>
</html>
