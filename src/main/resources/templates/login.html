<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Sign in</title>
	<style>
		body { font-family: sans-serif; margin: 1.5rem; max-width: 24rem; }
		label { display: block; margin-top: 0.75rem; }
		.notice { background: #fff6d8; padding: 0.5rem; }
	</style>
</head>
<body>
<h1>Sign in</h1>
<p class="notice" th:if="${notice}" th:text="${notice}"></p>
<form method="post" th:action="@{/login}">
	<label>Username <input type="text" name="username" autocomplete="username" required autofocus/></label>
	<label>Password <input type="password" name="password" autocomplete="current-password" required/></label>
	<p><button type="submit">Sign in</button></p>
</form>
<p>HTTP Basic still works for the JSON API and the demo script.</p>
</body>
</html>
