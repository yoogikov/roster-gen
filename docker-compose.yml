services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: roster
      POSTGRES_DB: roster
    ports:
      - "5432:5432"
    volumes:
      - roster-pg:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ROSTER_DB_URL: jdbc:postgresql://postgres:5432/roster
      ROSTER_DB_USER: roster
      ROSTER_DB_PASSWORD: roster
      ROSTER_ADMIN_PASSWORD: ${ROSTER_ADMIN_PASSWORD:?Set ROSTER_ADMIN_PASSWORD in the environment or a git-ignored .env file}
    depends_on:
      - postgres

volumes:
  roster-pg:
