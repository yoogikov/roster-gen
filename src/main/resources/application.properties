spring.application.name=roster

# Used when no profile is given (e.g. ./gradlew bootRun). Production must set
# SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.default=dev

# Keep JPA sessions inside the service layer; the web layer must not lazy-load entities.
spring.jpa.open-in-view=false

# All roster dates and times are in IST.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
