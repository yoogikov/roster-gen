<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"/>
	<title>Roster</title>
	<style>
		body { font-family: sans-serif; margin: 1.5rem; }
		nav a { margin-right: 1rem; }
		table { border-collapse: collapse; }
		td, th { border: 1px solid #ccc; padding: 0.3rem 0.5rem; vertical-align: top; }
		.notice { background: #fff6d8; padding: 0.5rem; }
		form.stack label { display: block; margin-top: 0.5rem; }
	</style>
</head>
<body>
<nav th:replace="~{nav :: nav}"></nav>
<h1>Duty roster</h1>
<p class="notice" th:if="${notice}" th:text="${notice}"></p>
<section th:if="${admin}">
	<h2>Generate a month</h2>
	<p>One doctor per line: id, name. Synthetic names only.</p>
	<form class="stack" method="post" action="/rosters/generate">
		<label>Month <input name="month" value="2026-11" required="required"/></label>
		<label>Doctors <textarea name="doctors" rows="6" required="required">D01,Test Doctor 1
D02,Test Doctor 2
D03,Test Doctor 3
D04,Test Doctor 4
D05,Test Doctor 5
D06,Test Doctor 6
D07,Test Doctor 7
D08,Test Doctor 8
D09,Test Doctor 9
D10,Test Doctor 10
D11,Test Doctor 11</textarea></label>
		<label>First on nights <input name="firstOnNights" value="D01" required="required"/></label>
		<label>Weekday doctors per shift <input name="weekday" type="number" value="4" min="2"/></label>
		<label>Weekend doctors per shift <input name="weekend" type="number" value="2" min="2"/></label>
		<button type="submit">Generate</button>
	</form>
</section>
<p th:unless="${admin}">The roster sheet is read-only for staff. An admin generates and edits it.</p>
</body>
</html>
